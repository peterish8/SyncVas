name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify
  relay-image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build relay container
        run: docker build -f socket-server/Dockerfile -t syncvas-relay:ci .
      - name: Check relay production startup
        shell: bash
        run: |
          relay_test_secret="$(openssl rand -hex 32)"
          docker run --detach --name syncvas-relay-ci \
            --publish 127.0.0.1:4001:4001 \
            --env NODE_ENV=production \
            --env SOCKET_PORT=4001 \
            --env SOCKET_INTERNAL_SECRET="$relay_test_secret" \
            --env ALLOWED_WEB_ORIGINS=https://syncvas-preview-pratzys-projects.vercel.app \
            --env RELAY_SINGLE_INSTANCE=1 \
            --env RELAY_TRUST_PROXY=0 \
            syncvas-relay:ci
          trap 'docker rm --force syncvas-relay-ci > /dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4001/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs syncvas-relay-ci
          exit 1
