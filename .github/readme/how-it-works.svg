<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">How a Syncvas class works</title>
  <desc id="flow-desc">Four steps: the teacher starts a live board, students join with a QR code or six-character code, everyone sees strokes live while exploring freely or following the teacher, and End Class keeps the board and builds AI notes.</desc>
  <defs>
    <style>
      .sans { font-family: "Bricolage Grotesque", "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .draw { stroke-dasharray: 600; animation: draw 2s cubic-bezier(.22,1,.36,1) .3s both; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
      .drift { animation: drift 5s ease-in-out infinite; }
      @keyframes draw { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.72); } }
      @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(6px, -4px); } }
      @media (prefers-reduced-motion: reduce) { .draw, .pulse, .drift { animation: none; } }
    </style>
    <filter id="flow-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#171717" flood-opacity=".08"/></filter>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f47b68"/></marker>
  </defs>

  <rect width="1280" height="400" rx="32" fill="#f7f6f3"/>

  <!-- Step cards -->
  <g filter="url(#flow-shadow)" fill="#ffffff" stroke="#dddcd7">
    <rect x="40" y="40" width="280" height="320" rx="26"/>
    <rect x="346" y="40" width="280" height="320" rx="26"/>
    <rect x="652" y="40" width="280" height="320" rx="26"/>
    <rect x="958" y="40" width="280" height="320" rx="26"/>
  </g>
  <rect x="56" y="56" width="248" height="150" rx="18" fill="#f4fcb8"/>
  <rect x="362" y="56" width="248" height="150" rx="18" fill="#e6f1fb"/>
  <rect x="668" y="56" width="248" height="150" rx="18" fill="#fff6e3"/>
  <rect x="974" y="56" width="248" height="150" rx="18" fill="#e8f5e9"/>

  <!-- 1. Start a live board -->
  <rect x="96" y="88" width="168" height="100" rx="12" fill="#fffefa" stroke="#171717" stroke-width="1.5"/>
  <path class="draw" d="M112 160 C124 124, 140 176, 156 140 S 188 118, 204 152 S 230 150, 244 128" fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
  <rect x="206" y="98" width="48" height="18" rx="9" fill="#d7f500"/>
  <circle cx="216" cy="107" r="3.5" fill="#171717" class="pulse"/>
  <text x="224" y="111" class="sans" font-size="10" font-weight="700" fill="#171717">Live</text>
  <g transform="translate(256 116) rotate(28)">
    <rect x="-4" y="-34" width="8" height="34" rx="3" fill="#171717"/>
    <rect x="-4" y="-34" width="8" height="8" rx="3" fill="#d7f500"/>
    <path d="M-4 0 L0 9 L4 0Z" fill="#171717"/>
  </g>

  <!-- 2. Students join -->
  <rect x="392" y="90" width="96" height="96" rx="12" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
  <g fill="none" stroke="#171717" stroke-width="3.5">
    <rect x="402" y="100" width="22" height="22" rx="4"/>
    <rect x="456" y="100" width="22" height="22" rx="4"/>
    <rect x="402" y="154" width="22" height="22" rx="4"/>
  </g>
  <g fill="#171717">
    <rect x="409" y="107" width="8" height="8" rx="1.5"/>
    <rect x="463" y="107" width="8" height="8" rx="1.5"/>
    <rect x="409" y="161" width="8" height="8" rx="1.5"/>
    <rect x="438" y="102" width="6" height="6"/><rect x="438" y="114" width="6" height="6"/>
    <rect x="446" y="126" width="6" height="6"/><rect x="430" y="134" width="6" height="6"/>
    <rect x="456" y="134" width="6" height="6"/><rect x="468" y="142" width="6" height="6"/>
    <rect x="438" y="150" width="6" height="6"/><rect x="456" y="160" width="6" height="6"/>
    <rect x="468" y="170" width="6" height="6"/><rect x="440" y="172" width="6" height="6"/>
  </g>
  <g class="mono" font-size="16" font-weight="700" fill="#171717" text-anchor="middle">
    <g fill="#ffffff" stroke="#171717" stroke-width="1.5">
      <rect x="508" y="98" width="28" height="34" rx="8"/><rect x="542" y="98" width="28" height="34" rx="8"/><rect x="576" y="98" width="28" height="34" rx="8"/>
      <rect x="508" y="142" width="28" height="34" rx="8"/><rect x="542" y="142" width="28" height="34" rx="8"/><rect x="576" y="142" width="28" height="34" rx="8" fill="#d7f500"/>
    </g>
    <text x="522" y="121">K</text><text x="556" y="121">7</text><text x="590" y="121">M</text>
    <text x="522" y="165">2</text><text x="556" y="165">Q</text><text x="590" y="165">X</text>
  </g>

  <!-- 3. Teach, explore, return -->
  <rect x="700" y="86" width="200" height="108" rx="12" fill="#fffefa" stroke="#171717" stroke-width="1.5"/>
  <path d="M724 158 H880 M800 176 V96" fill="none" stroke="#a8a69e" stroke-width="1.5"/>
  <path d="M760 102 Q800 214 840 102" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="764" y="112" width="72" height="58" rx="6" fill="#d7f500" fill-opacity=".28" stroke="#171717" stroke-width="2"/>
  <g class="drift" fill="none" stroke-width="2" stroke-dasharray="5 4">
    <rect x="712" y="98" width="56" height="44" rx="6" stroke="#f47b68"/>
    <rect x="826" y="136" width="62" height="46" rx="6" stroke="#39a954"/>
    <rect x="846" y="94" width="44" height="34" rx="6" stroke="#66645f"/>
  </g>
  <path d="M736 142 Q740 166 758 162" fill="none" stroke="#f47b68" stroke-width="2" stroke-linecap="round" marker-end="url(#flow-arrow)"/>

  <!-- 4. Keep the lesson -->
  <rect x="1030" y="78" width="116" height="120" rx="12" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
  <rect x="1042" y="90" width="92" height="40" rx="6" fill="#f7f6f3" stroke="#dddcd7"/>
  <path d="M1050 120 C1062 98, 1074 128, 1086 108 S 1110 100, 1124 116" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"/>
  <g fill="#c9c7c0">
    <rect x="1042" y="142" width="80" height="5" rx="2.5"/><rect x="1042" y="154" width="92" height="5" rx="2.5"/>
    <rect x="1042" y="166" width="64" height="5" rx="2.5"/><rect x="1042" y="178" width="76" height="5" rx="2.5"/>
  </g>
  <path class="pulse" d="M1172 80 L1176 92 L1188 96 L1176 100 L1172 112 L1168 100 L1156 96 L1168 92Z" fill="#d7f500" stroke="#171717" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="1150" cy="184" r="14" fill="#39a954"/>
  <path d="M1143 184 L1148 189 L1158 179" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step numbers -->
  <g class="sans" font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="76" cy="76" r="14" fill="#171717"/><text x="76" y="81" fill="#ffffff">1</text>
    <circle cx="382" cy="76" r="14" fill="#171717"/><text x="382" y="81" fill="#ffffff">2</text>
    <circle cx="688" cy="76" r="14" fill="#171717"/><text x="688" y="81" fill="#ffffff">3</text>
    <circle cx="994" cy="76" r="14" fill="#171717"/><text x="994" y="81" fill="#ffffff">4</text>
  </g>

  <!-- Connectors -->
  <g fill="#d7f500" stroke="#171717" stroke-width="1.5">
    <circle cx="333" cy="131" r="14"/><circle cx="639" cy="131" r="14"/><circle cx="945" cy="131" r="14"/>
  </g>
  <g fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 125 L336 131 L330 137"/><path d="M636 125 L642 131 L636 137"/><path d="M942 125 L948 131 L942 137"/>
  </g>

  <!-- Copy -->
  <g class="sans">
    <g font-size="20" font-weight="700" letter-spacing="-.4" fill="#171717">
      <text x="64" y="244">Start a live board</text>
      <text x="370" y="244">Students join</text>
      <text x="676" y="244">Teach, explore, return</text>
      <text x="982" y="244">Keep the lesson</text>
    </g>
    <g font-size="14.5" fill="#66645f">
      <text x="64" y="274">Create a room and write with</text>
      <text x="64" y="296">a stylus. Only the teacher</text>
      <text x="64" y="318">can edit the board.</text>
      <text x="370" y="274">Scan the QR or type six</text>
      <text x="370" y="296">characters. No student</text>
      <text x="370" y="318">accounts, nothing to install.</text>
      <text x="676" y="274">Everyone sees strokes live.</text>
      <text x="676" y="296">Students pan and zoom on</text>
      <text x="676" y="318">their own, or follow you.</text>
      <text x="982" y="274">End Class saves the final</text>
      <text x="982" y="296">board and builds AI notes</text>
      <text x="982" y="318">students can come back to.</text>
    </g>
  </g>
</svg>
